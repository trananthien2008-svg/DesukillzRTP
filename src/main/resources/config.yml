# ============================================================
#  DesukillzRTP
#  Sau khi sửa file này, gõ /rtp reload (GUI đang mở sẽ tự cập nhật)
# ============================================================

# Thời gian hồi (giây) sau mỗi lần RTP thành công. 0 = không hồi.
# Người có quyền desukillz.rtp.cooldown.bypass không bị hồi.
cooldown-seconds: 60

# ------------------------------------------------------------
# THẾ GIỚI
#   enabled: false  = bị khoá, không ai RTP vào được (kể cả dùng lệnh /rtp nether)
#   world-name      = tên thư mục world trên server (plugin KHÔNG tự tạo world)
#   min/max-radius  = khoảng cách tới tâm (center-x, center-z)
#   min-y/max-y     = khoảng độ cao tìm chỗ đứng (dùng cho Nether và The End)
#   max-attempts    = số lần thử tối đa trước khi báo không tìm được
#
# MỞ KHOÁ NETHER / THE END: đổi enabled thành true rồi gõ /rtp reload
# ------------------------------------------------------------
worlds:
  overworld:
    enabled: true
    world-name: "world"
    min-radius: 500
    max-radius: 5000
    center-x: 0
    center-z: 0
    max-attempts: 30
  nether:
    enabled: false
    world-name: "world_nether"
    min-radius: 100
    max-radius: 2000
    center-x: 0
    center-z: 0
    min-y: 33
    max-y: 120
    max-attempts: 40
  end:
    enabled: false
    world-name: "world_the_end"
    # Đảo chính của The End có bán kính khoảng 70-80 block.
    # Muốn RTP sang các đảo ngoài, đặt min-radius >= 1100 và max-radius lớn hơn.
    min-radius: 55
    max-radius: 70
    center-x: 0
    center-z: 0
    min-y: 5
    max-y: 100
    max-attempts: 60

