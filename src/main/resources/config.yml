# ------------------------------------------------------------
# ÂM THANH
# Dùng tên âm thanh của Minecraft (viết thường, dấu chấm), ví dụ:
#   BLOCK_CHEST_OPEN         -> block.chest.open
#   BLOCK_NOTE_BLOCK_PLING   -> block.note_block.pling
#   BLOCK_NOTE_BLOCK_BASS    -> block.note_block.bass
# Để sound trống ("") để tắt âm thanh đó.
# ------------------------------------------------------------
sounds:
  open:    { sound: "block.chest.open",        volume: 0.8, pitch: 1.0 }
  select:  { sound: "block.note_block.pling",  volume: 1.0, pitch: 1.6 }
  locked:  { sound: "block.note_block.bass",   volume: 1.0, pitch: 0.7 }
  success: { sound: "entity.enderman.teleport", volume: 0.8, pitch: 1.0 }
  fail:    { sound: "entity.villager.no",      volume: 1.0, pitch: 1.0 }
  close:   { sound: "block.chest.close",       volume: 0.8, pitch: 1.0 }

# ------------------------------------------------------------
# HÀNG CHỜ PVP /rtpq  (độc lập với GUI RTP)
#   /rtpq        vào hàng chờ, đủ 2 người sẽ được ghép cặp và RTP đến gần nhau
#   /rtpq leave  rời hàng chờ
# ------------------------------------------------------------
queue:
  enabled: true
  world: overworld
  # Khoảng cách tối đa giữa hai đối thủ sau khi dịch chuyển
  pair-distance: 8
  # Trận tự kết thúc sau số giây này
  match-timeout-seconds: 600
  # false = người đang trong trận không được dùng /rtp để trốn
  allow-rtp-during-match: false

